<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Web in Real Time</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>The Web in Real Time</h1>
    <p class="intro">Live weather from the Open-Meteo API drives the colour, motion and text of this page.</p>
  </header>

  <section class="controls" aria-label="Controls">
    <div class="city-buttons" role="group" aria-label="Choose a city">
      <button type="button" data-city="toronto" aria-pressed="true">Toronto</button>
      <button type="button" data-city="london" aria-pressed="false">London</button>
      <button type="button" data-city="tokyo" aria-pressed="false">Tokyo</button>
      <button type="button" data-city="reykjavik" aria-pressed="false">Reykjavík</button>
    </div>
    <div class="action-buttons">
      <button type="button" id="unit-toggle" aria-label="Switch temperature unit">°F</button>
      <button type="button" id="refresh">Refresh</button>
    </div>
  </section>

  <main class="stage" id="stage">
    <div class="wind" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>

    <article class="card" aria-live="polite">
      <p class="city-name" id="city-name">Loading…</p>
      <p class="temperature" id="temperature">--</p>
      <p class="condition" id="condition">Fetching live data</p>
      <dl class="details">
        <div><dt>Feels like</dt><dd id="feels-like">--</dd></div>
        <div><dt>Wind</dt><dd id="wind">--</dd></div>
        <div><dt>Daylight</dt><dd id="daylight">--</dd></div>
      </dl>
      <p class="status" id="status"></p>
    </article>
  </main>

  <footer class="site-footer">
    <p>Data: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>, refreshed every 5 minutes.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
